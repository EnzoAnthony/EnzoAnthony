<g font-family="'DejaVu Sans Mono','SF Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5">
<text x="542.4" y="84.3" fill="#f0f6fc" font-weight="bold">EnzoAnthony</text>
<line x1="635.2" y1="80.3" x2="928" y2="80.3" stroke="#484f58"/>
<text x="542.4" y="133.8" fill="#c9d1d9">Olá, eu sou o Enzo. Sou graduando em Engenharia</text>
<text x="542.4" y="155.8" fill="#c9d1d9">Química na USP e foi nela que descobri o quanto</text>
<text x="542.4" y="177.8" fill="#c9d1d9">gosto de resolver problemas. Hoje sei que quero</text>
<text x="542.4" y="199.8" fill="#c9d1d9">seguir carreira em tecnologia, e é para essa direção</text>
<text x="542.4" y="221.8" fill="#c9d1d9">que minhas atuais decisões convergem.</text>
<text x="542.4" y="255.9" fill="#c9d1d9">Estudo programação com o CS50x, de Harvard, que</text>
<text x="542.4" y="277.9" fill="#c9d1d9">passa por C, algoritmos, Python, SQL e</text>
<text x="542.4" y="299.9" fill="#c9d1d9">desenvolvimento web. Gosto de problemas de lógica e</text>
<text x="542.4" y="321.9" fill="#c9d1d9">da sensação de entregar uma solução que funciona, o</text>
<text x="542.4" y="343.9" fill="#c9d1d9">mesmo prazer que sinto ao fazer um hobbie</text>
<text x="542.4" y="365.9" fill="#c9d1d9">- consertar desktops, notebooks e celulares.</text>
<text x="542.4" y="400.1" fill="#c9d1d9">Também me interesso muito por inteligência artificial.</text>
<text x="542.4" y="422.1" fill="#c9d1d9">No dia a dia, uso IA para automatizar tarefas</text>
<text x="542.4" y="444.1" fill="#c9d1d9">do meu atual estágio, organizar minha semana e</text>
<text x="542.4" y="466.1" fill="#c9d1d9">estudar. Agora quero aprender a construir esse tipo</text>
<text x="542.4" y="488.1" fill="#c9d1d9">de solução, utilizando da programação e estou em</text>
<text x="542.4" y="510.1" fill="#c9d1d9">busca da minha primeira vaga em tech.</text>
</g></svg>
